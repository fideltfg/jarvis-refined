# Copy to ~/.config/jarvis/config.toml. Non-secret settings only: API keys and
# tokens go in ~/.config/jarvis/secrets.env (chmod 600; template: .env.example).
# Environment variables already set in the process override this file.
# Restart the bridge and Vite server after editing.

# Compiled into the browser bundle; treat every value as public.
[frontend]
theme = "stark"            # a folder in public/themes: stark, hal, wopr, mother, lcars, orin
backend = "bridge"         # "bridge" (recommended) or "direct" (browser calls Claude itself)
bridge_url = "/bridge"     # a path means the same origin as the page
tts_engine = "system"      # "kokoro" (local neural voice) or "system" (browser speech)
# kokoro_voice = "bm_george"
# use_elevenlabs = false
# elevenlabs_voice_id = "JBFqnCBsd6RMkjVDRZzb"
# model = "claude-opus-5"  # direct mode only
# fast_mode = true         # direct mode only

# Extra direct-mode MCP servers. token_env names a VITE_* variable in
# secrets.env, so the token itself never sits here. Same name as a built-in
# (zapier, pipedream, notion, linear, github, stripe, sentry, home) replaces it.
# [[frontend.mcp_servers]]
# name = "docs"
# label = "Docs"
# url = "https://mcp.example.com/mcp"
# token_env = "VITE_DOCS_TOKEN"

# Read by the bridge, agent service and Vite server only; never sent to the browser.
[bridge]
# bridge_port = 8787
# face_port = 5173
# host = "0.0.0.0"           # LAN access; needs tls_cert and tls_key
# tls_cert = "/path/cert.pem"
# tls_key = "/path/key.pem"
# model = "claude-opus-5"
# effort = "high"
# max_turns = 24
# provider = "claude"        # initial HUD provider: claude, openai or local
# openai_model = "gpt-4.1-mini"
# local_url = "http://localhost:11434/v1"
# local_model = "llama3.1:8b"
# allow_writes = false
# allowed_origins = ["https://jarvis.lan:5173"]
# file_roots = ["/mnt/footage"]
# agents = true              # background-agent tools; needs the agent service
# agents_port = 8788
# max_workers = 3
# auto_compact_window = 150000

# Model endpoint pool; replaces local_url/local_model when set. Each entry:
# id, kind (anthropic | openai | gateway | remote), baseURL, model,
# concurrency, kinds (code, research, ops, admin), apiKeyEnv, weight, label.
# apiKeyEnv is the NAME of a variable in secrets.env, never the key itself.
# endpoints = [
#   { id = "claude", kind = "anthropic", concurrency = 3 },
